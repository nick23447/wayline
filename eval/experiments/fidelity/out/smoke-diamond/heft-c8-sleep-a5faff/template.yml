apiVersion: wl.io/v1
kind: ODAGTemplate
metadata:
  name: smoke-diamond-heft-c8-sleep-a5faff
  namespace: wl-runs
  labels:
    fidelity/c: '8'
    fidelity/mode: sleep
    fidelity/scheduler: heft
    fidelity/sec-per-cost: '1.0'
    fidelity/bytes-per-size: '1.0'
    fidelity/hash-rate: '0.0'
  annotations:
    fidelity/speed: cse-lambda1=1.0,cse-isha=1.0
spec:
  scheduler: random
  schedulerConfig:
    nodeOrder:
      cse-isha:
      - a
      - b
      - c
      - d
    enactOrder: order
  profiling:
    enabled: false
    runtimeSource: manual
    bandwidthSource: external
  retention:
    data:
      policy: keepLatest
      keepRuns: 1
  tasks:
  - name: a
    image: cse-lambda1:5000/wl-fidelity-task:latest
    command:
    - python
    - task.py
    dependencies: []
    resources:
      cpu: '1'
      memory: 570Mi
    constraints:
      nodeNames:
      - cse-isha
    runtime: 2.0
    runtimeProfile:
      cse-lambda1: 2.0
      cse-isha: 2.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '2.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=1.0
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: ''
    - name: FID_OUTPUTS
      value: to-b:10000000,to-c:20000000
    outputs:
    - name: to-b
      dataSize: '10000000'
    - name: to-c
      dataSize: '20000000'
  - name: b
    image: cse-lambda1:5000/wl-fidelity-task:latest
    command:
    - python
    - task.py
    dependencies:
    - a
    resources:
      cpu: '1'
      memory: 541Mi
    constraints:
      nodeNames:
      - cse-isha
    runtime: 4.0
    runtimeProfile:
      cse-lambda1: 4.0
      cse-isha: 4.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '4.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=1.0
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: a.to-b
    - name: FID_OUTPUTS
      value: to-d:5000000
    inputs:
    - producer: a
      object: to-b
    outputs:
    - name: to-d
      dataSize: '5000000'
  - name: c
    image: cse-lambda1:5000/wl-fidelity-task:latest
    command:
    - python
    - task.py
    dependencies:
    - a
    resources:
      cpu: '1'
      memory: 560Mi
    constraints:
      nodeNames:
      - cse-isha
    runtime: 3.0
    runtimeProfile:
      cse-lambda1: 3.0
      cse-isha: 3.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '3.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=1.0
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: a.to-c
    - name: FID_OUTPUTS
      value: to-d:5000000
    inputs:
    - producer: a
      object: to-c
    outputs:
    - name: to-d
      dataSize: '5000000'
  - name: d
    image: cse-lambda1:5000/wl-fidelity-task:latest
    command:
    - python
    - task.py
    dependencies:
    - b
    - c
    resources:
      cpu: '1'
      memory: 532Mi
    constraints:
      nodeNames:
      - cse-isha
    runtime: 1.0
    runtimeProfile:
      cse-lambda1: 1.0
      cse-isha: 1.0
    env:
    - name: FID_MODE
      value: sleep
    - name: FID_SECONDS
      value: '1.0'
    - name: FID_SPEED
      value: cse-lambda1=1.0,cse-isha=1.0
    - name: FID_HASH_RATE
      value: '0.0'
    - name: FID_INPUTS
      value: b.to-d,c.to-d
    - name: FID_OUTPUTS
      value: ''
    inputs:
    - producer: b
      object: to-d
    - producer: c
      object: to-d
